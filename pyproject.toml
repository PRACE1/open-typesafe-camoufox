[project]
name = "open-typesafe-camoufox"
version = "0.1.0"
description = "Jev-primary computer use on headed Camoufox: cheap classifier decides (kind/item/site + confidence), small writer writes, one platform adapter. Shaped after typesafe-computer-use."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
    "camoufox>=0.4",
    "playwright>=1.40",
    "pillow>=10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "humanmovemouse>=1.2.0",
    "python-statemachine>=3.2.1",
]

[project.scripts]
open-typesafe-camoufox = "src.run.run:cli"
otc = "src.run.run:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
